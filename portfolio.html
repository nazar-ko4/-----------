<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/var.css">
    <title>Портфоліо</title>
</head>

<body class="w-full min-h-screen">
    <div class="page-side items-center justify-center min-h-screen">
        <a href="https://t.me/syr_mem" class="page-side-link">
            <img class="md:w-[60%] m-3 items-center justify-center" src="assets/img/holuba.jpg" id="leftflyanim">
        </a>
    </div>

    <div class="bg-[#8eb1f3]/82 min-h-screen border-r-4 border-l-4 border-[#2554bb] border-dashed flex flex-col"
        id="block">
        <div class="w-full min-h-[280px] mb-4">
            <header class="w-full min-h-[280px] flex flex-col items-center justify-end relative">
                <div class="header relative flex-1 min-h-[200px] w-full">
                    <div class="splash-text" id="splash-text"></div>
                </div>
                <nav class="flex w-full flex-nowrap">
                    <a class="flex min-w-0 flex-1 items-center justify-center whitespace-nowrap bg-blue-400 px-2 py-3 text-center text-purple-100 transition hover:bg-blue-100 hover:text-black sm:px-4"
                        href="index.html">головна</a>
                    <a class="flex min-w-0 flex-1 items-center justify-center whitespace-nowrap bg-blue-400 px-2 py-3 text-center text-purple-100 transition hover:bg-blue-100 hover:text-black sm:px-4"
                        href="about.html">про мене</a>
                    <a class="flex min-w-0 flex-1 items-center justify-center whitespace-nowrap bg-blue-500 px-2 py-3 text-center text-purple-100 transition hover:bg-blue-100 hover:text-black sm:px-4"
                        href="portfolio.html" aria-current="page">портфоліо</a>
                </nav>
            </header>
        </div>

        <main class="flex-1">
            <div class="waterfall-grid portfolio-grid p-4">
                <figure class="grid-span-1 portfolio-card border-[#2554bb] border-2 border-dashed rounded">
                    <img src="https://picsum.photos/seed/portfolio-1/800/600" alt="Зображення портфоліо 1">
                    <figcaption>
                        <h3>Назва проєкту</h3>
                        <p>Короткий опис проєкту</p>
                    </figcaption>
                </figure>

                <figure class="grid-span-2x1 portfolio-card border-[#2554bb] border-2 border-dashed rounded">
                    <img src="https://picsum.photos/seed/portfolio-2/1200/600" alt="Зображення портфоліо 2">
                    <figcaption>
                        <h3>Ще один проєкт</h3>
                        <p>Підзаголовок можна змінити або видалити.</p>
                    </figcaption>
                </figure>

                <figure class="grid-span-1 portfolio-card border-[#2554bb] border-2 border-dashed rounded">
                    <img src="https://picsum.photos/seed/portfolio-3/800/600" alt="Зображення портфоліо 3">
                </figure>

                <figure class="grid-span-1x2 portfolio-card border-[#2554bb] border-2 border-dashed rounded">
                    <img src="https://picsum.photos/seed/portfolio-4/800/1200" alt="Зображення портфоліо 4">
                </figure>

                <figure class="grid-span-1x2 portfolio-card border-[#2554bb] border-2 border-dashed rounded">
                    <img src="https://picsum.photos/seed/portfolio-5/800/1200" alt="Зображення портфоліо 5">
                </figure>
            </div>
        </main>

        <footer
            class="mt-8 bg-blue-400 w-full min-h-[150px] text-blue-100 flex-col flex item p-4">
            <div class="flex flex-1">
 
            <div class="w-full">
                    <a class="flex min-w-0 flex-1 items-center justify-center whitespace-nowrap text-center text-blue-100"
                        href="index.html" aria-current="page">головна</a>
                    <a class="flex min-w-0 flex-1 items-center justify-center whitespace-nowrap text-center text-blue-100"
                        href="about.html">про мене</a>
                    <a class="flex min-w-0 flex-1 items-center justify-center whitespace-nowrap text-center text-blue-100"
                        href="portfolio.html">портфоліо</a>
            </div>
            </div>
            <div class="w-full text-center justify-center items-center">
                <br>
                <hr>
                <br>
                все налеєжить мені 2026 с
            </div>
        </footer>
    </div>

    <div class="page-side items-center justify-center min-h-screen">
        <a href="https://t.me/syr_mem" class="page-side-link">
            <img class="md:w-[60%] m-3" src="assets/img/mem14.png" id="rightflyanim">
        </a>
    </div>

    <script>
        const splashTexts = [
            "Ласкаво просимо на мій сайт!",
            "Досліджуйте моє портфоліо!",
            "Знайомтесь зі мною!",
            "Відкрийте для себе мої проекти!",
            "Приємного перегляду!"
        ];

        const splashTextElement = document.getElementById("splash-text");
        const randomIndex = Math.floor(Math.random() * splashTexts.length);
        splashTextElement.textContent = splashTexts[randomIndex];
    </script>
</body>

</html>
